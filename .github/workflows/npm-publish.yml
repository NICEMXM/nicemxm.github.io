name: Deploy Hexo Site

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # 已适配新版 runner

      - name: Setup Node
        uses: actions/setup-node@v4   # 升级到 v4，支持最新 runner
        with:
          node-version: '20'         # Hexo 7 推荐使用 Node 20
          cache: 'npm'               # 自动缓存依赖，加速构建

      - name: Install dependencies
        run: |
          npm install -g hexo-cli
          npm install --legacy-peer-deps   # 解决可能存在的依赖冲突

      - name: Generate site
        run: hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: ${{ github.event.head_commit.message }}
          # 如果强制推送到 gh-pages 分支，可以加上 force_orphan: true（视需求而定）
